<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1326"/>
      <stop offset="100%" stop-color="#060E20"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Hexagon -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Outer Tech Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="6" stroke-dasharray="16 10"/>

  <!-- Logo Crest AC Text -->
  <text x="256" y="305" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="210" fill="url(#iconGrad)" text-anchor="middle" letter-spacing="-6">AC</text>
  
  <!-- Glowing Pulse Dot -->
  <circle cx="390" cy="120" r="22" fill="#06B6D4" filter="url(#glow)"/>
</svg>
